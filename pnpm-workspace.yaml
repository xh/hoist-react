# pnpm settings (pnpm 11+ reads these from this file, not from a `pnpm` field in package.json).
# This is a single-package repo - the file exists for settings only, not to define a workspace.

# Dependency build scripts do not run unless reviewed here; unreviewed scripts are a hard error
# in CI. esbuild (via tsx, which powers the bin/hoist-* CLI tools) is allowed so its platform
# binary install is guaranteed. The rest are declined: @parcel/watcher (via dev-utils' sass
# watch-mode support, unused here) has a native build with prebuilt binaries shipped as optional
# platform deps, browser-tabs-lock (via auth0-spa-js) ships prebuilt dist, and core-js's
# postinstall only prints a funding message.
allowBuilds:
  '@parcel/watcher': false
  browser-tabs-lock: false
  core-js: false
  esbuild: true

# Caret vs. tilde policy for `dependencies` in package.json. These ranges are the contract
# consuming apps resolve against (our lockfile never applies to them), so qualifiers are chosen
# deliberately, per two tests:
#
# 1. Behavior surface - can a minor version change what an app user sees or does? If yes, tilde.
#    Covers UI/interaction components, libs whose output reaches the screen (formatting, markdown
#    rendering, fonts), and load-bearing infrastructure (state management, auth, routing). Also
#    the demotion path for any library whose semver discipline has burned us before.
# 2. Graph constraint - is the package part of a multi-package family, or commonly pulled in
#    transitively, such that a tight pin risks duplicate copies (e.g. @blueprintjs/*,
#    @codemirror/*, @fortawesome/*)? If yes, caret - and this test WINS over test 1, because a
#    duplicate is worse than an untested minor (two copies of @codemirror/state break the editor
#    outright). To truly freeze such a family, use a pnpm override, not a tilde.
#
# Everything else - headless utilities and deps used only by the bin/hoist-* CLI tools - gets
# caret. Keep coupled packages (e.g. a lib and its react wrapper) on the same qualifier and bump
# them together.
#
# Operationally: `pnpm update` respects declared ranges - caret deps float through minors on
# routine update runs, while tilde deps take patches only. Moving a tilde dep's minor is a
# deliberate, per-package act (e.g. `pnpm update foo@1.2`), with testing behind it.

# New deps added via `pnpm add` get caret ranges, letting minors float. Note this does not affect
# `pnpm update`, which preserves whatever operator a dep already declares - so deliberate tilde
# specs (e.g. most runtime deps) keep their tildes across update runs.
savePrefix: '^'

# pnpm's minimum-release-age gate refuses freshly published versions as supply-chain protection.
# Exempt XH's own packages - hoist-dev-utils SNAPSHOTs may be consumed minutes after publish.
minimumReleaseAgeExclude:
  - '@xh/*'

# Adding an `overrides` entry for a package that is also a direct dep? Put its version in a
# `catalog:` entry and point both `package.json` and the override at `catalog:`. pnpm validates a
# lockfile against the override but `pnpm update` writes the raw package.json specifier, so if the
# two strings differ, `pnpm update` emits a lockfile that `pnpm install --frozen-lockfile` rejects
# (ERR_PNPM_OUTDATED_LOCKFILE) - visible only in CI, since a local install with node_modules
# present skips the check and reports "Already up to date". Note also that an override must name
# the dep's exact range to dedupe it; restating a broader range does nothing.

# Several transitive deps (react-popper, react-onsenui, react-windowed-select) still declare
# react/react-dom peer ranges capped at 18. Hoist v87 runs React 19 - acknowledge that here
# rather than surfacing unmet-peer warnings on every install.
peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
