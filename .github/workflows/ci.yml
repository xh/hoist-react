# CI — Validates linting and runs CodeQL analysis on PRs and pushes to develop.
#
# This workflow does not publish artifacts. For snapshot and release publishing,
# see Deploy Snapshot and Deploy Release.

name: CI

on:
    push:
        branches: [ "develop" ]
    pull_request:
        branches: [ "develop" ]
    schedule:
        - cron: '23 10 * * 4'

jobs:
    lint:
        # No need / benefit to run lint on a schedule.
        if: github.event_name != 'schedule'

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v7

        # Installs the pnpm version pinned via the packageManager field in package.json.
        - name: Setup pnpm
          uses: pnpm/action-setup@v6

        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version-file: '.nvmrc'
              cache: 'pnpm'

        - name: Configure Font Awesome registry auth
          env:
              FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          run: echo "//npm.fontawesome.com/:_authToken=$FONTAWESOME_PACKAGE_TOKEN" >> .npmrc

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Lint
          run: pnpm lint

        # Gates merges on a clean production-dependency audit for high and
        # critical advisories. The first, un-gated run prints lower-severity
        # findings in the step log for visibility without failing the build -
        # they accumulate as a known noise floor rather than blocking unrelated
        # PRs the moment a new advisory drops.
        - name: Audit production dependencies
          run: |
              pnpm audit --prod || true
              pnpm audit --prod --audit-level high

    codeql:

        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
        - uses: actions/checkout@v7

        - name: Initialize CodeQL
          uses: github/codeql-action/init@v4.37.6
          with:
              languages: javascript

        - name: Autobuild
          uses: github/codeql-action/autobuild@v4.37.6

        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v4.37.6
